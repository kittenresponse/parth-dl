name: Percept Instagram Reel Diagnostic
on:
  push:
    paths:
      - '.github/workflows/percept-instagram-diagnostic.yml'
  workflow_dispatch:
    inputs:
      reel_url:
        description: Public Instagram reel URL
        required: true
        default: https://www.instagram.com/reel/DgCSYFsvCw5/
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local extractor
        run: python -m pip install .
      - name: Validate URL and inspect
        id: extraction
        env:
          REEL_URL: ${{ inputs.reel_url || 'https://www.instagram.com/reel/DgCSYFsvCw5/' }}
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["REEL_URL"])
          assert u.scheme == "https" and u.hostname in ("instagram.com", "www.instagram.com"), "Only Instagram HTTPS URLs allowed"
          assert u.path.startswith(("/reel/", "/p/")), "Only reel/post URLs allowed"
          PY
          mkdir -p diagnostic
          set +e
          parth-dl --json "$REEL_URL" > diagnostic/result.json 2> diagnostic/error.log
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            python - <<'PY' || rc=1
          import json
          from pathlib import Path
          data = json.loads(Path("diagnostic/result.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not data:
              raise ValueError("Empty or invalid Instagram metadata")
          def contains_media_url(obj):
              if isinstance(obj, dict):
                  if any(isinstance(obj.get(k), str) and obj[k].startswith("https://") for k in ("video_url", "media_url", "download_url", "display_url")):
                      return True
                  return any(contains_media_url(v) for v in obj.values())
              if isinstance(obj, list):
                  return any(contains_media_url(v) for v in obj)
              return False
          if not contains_media_url(data):
              raise ValueError("No video or media URL found in extractor metadata")
          print("Media URL found in extractor metadata")
          PY
          fi
          echo "extractor_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then echo "Media URL found; video download and transcript not yet verified" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -ne 0 ]; then
            echo "Instagram extraction failed; review artifact for login wall, rate limiting or extractor incompatibility." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-diagnostic
          path: diagnostic/
          retention-days: 7
