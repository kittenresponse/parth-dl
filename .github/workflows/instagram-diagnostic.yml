name: Instagram public Reel diagnostic

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: Public Instagram Reel URL
        required: true
        default: https://www.instagram.com/reel/DgDDrAzIRzQ/
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader
        run: python -m pip install -e .
      - name: Check public Reel metadata
        env:
          TARGET_URL: ${{ inputs.instagram_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from urllib.parse import urlparse

          url = os.environ["TARGET_URL"]
          parsed = urlparse(url)
          parts = [p for p in parsed.path.split("/") if p]
          if parsed.scheme != "https" or parsed.hostname not in ("instagram.com", "www.instagram.com") or len(parts) != 2 or parts[0] not in ("reel", "p"):
              sys.exit("Invalid Instagram URL")
          canonical = f"https://www.instagram.com/{parts[0]}/{parts[1]}/"
          result = subprocess.run(["parth-dl", "--json", canonical], capture_output=True, text=True, timeout=150)
          print("Exit code:", result.returncode)
          if result.returncode:
              # Avoid printing credentials, full URLs, or media metadata.
              print("Downloader failed; see extractor diagnostics locally.")
              sys.exit(result.returncode)
          try:
              metadata = json.loads(result.stdout)
          except json.JSONDecodeError:
              sys.exit("Downloader returned non-JSON output")
          print("Metadata retrieval: SUCCESS")
          print("Media type:", metadata.get("type", "unknown"))
          PY
