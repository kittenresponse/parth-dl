name: Percept Instagram OSINT research and English translation

on:
  push:
    paths:
      - 'instagram-requests/*.json'
  workflow_dispatch:
    inputs:
      instagram_url:
        description: 'Public Instagram post or Reel URL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Instagram downloader
        run: python -m pip install --disable-pip-version-check .
      - name: Validate and normalize URL
        env:
          POST_URL: ${{ inputs.instagram_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,urllib.parse
          import glob,json
          raw=os.environ.get('POST_URL','').strip()
          if os.environ.get('EVENT_NAME')=='push':
              requests=glob.glob('instagram-requests/*.json')
              if not requests: raise SystemExit('No request file found')
              # Push-triggered request files use their commit change list, not arbitrary latest files.
              import urllib.request
              api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+os.environ['GITHUB_SHA']
              req=urllib.request.Request(api,headers={'Accept':'application/vnd.github+json','User-Agent':'Percept-Instagram-OSINT'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  commit=json.load(response)
              names=[f['filename'] for f in commit.get('files',[]) if f.get('status') in ('added','modified') and f['filename'].startswith('instagram-requests/') and f['filename'].endswith('.json')]
              if len(names)!=1: raise SystemExit('Expected exactly one Instagram request in triggering commit: '+repr(names))
              raw=json.load(open(names[0]))['instagram_url']
          u=urllib.parse.urlparse(raw)
          parts=[p for p in u.path.split('/') if p]
          if u.scheme!='https' or u.hostname not in ('instagram.com','www.instagram.com') or len(parts)!=2 or parts[0] not in ('p','reel') or not parts[1].replace('_','').replace('-','').isalnum():
              raise SystemExit('Unsupported URL: only public Instagram /p/ or /reel/ links')
          url=f'https://www.instagram.com/{parts[0]}/{parts[1]}/'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CANONICAL_URL='+url+'\n')
          print('Validated:',url)
          PY
      - name: Extract public metadata
        env:
          TARGET_URL: ${{ env.CANONICAL_URL }}
        run: |
          mkdir -p osint-output
          python - <<'PY'
          import subprocess,json,os,datetime
          url=os.environ['TARGET_URL']
          p=subprocess.run(['parth-dl','--json',url],capture_output=True,text=True,timeout=180)
          metadata=None
          if p.returncode==0:
              try: metadata=json.loads(p.stdout)
              except ValueError: pass
          status='SUCCESS' if metadata else ('RATE_LIMITED' if p.returncode==4 else 'FAILED')
          report={'source_url':url,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':status,'exit_code':p.returncode,'metadata':metadata,'diagnostic':p.stderr[-3000:]}
          with open('osint-output/result.json','w') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          if not metadata: raise SystemExit('Public Instagram metadata unavailable; see result.json')
          PY
      - name: Download public Reel
        env:
          TARGET_URL: ${{ env.CANONICAL_URL }}
        run: parth-dl -P osint-output "$TARGET_URL"
      - name: Transcribe and translate speech into English
        run: |
          python -m pip install --disable-pip-version-check faster-whisper
          python - <<'PY'
          import glob,json
          # Compatibility with PyAV versions whose av.open lacks metadata_errors.
          import av
          _av_open=av.open
          def _compatible_open(*args,**kwargs):
              kwargs.pop('metadata_errors',None)
              return _av_open(*args,**kwargs)
          av.open=_compatible_open
          from faster_whisper import WhisperModel
          files=glob.glob('osint-output/*.mp4')
          if not files:
              print('No video file: no audio transcription')
          else:
              model=WhisperModel('small',device='cpu',compute_type='int8')
              seg,info=model.transcribe(files[0],task='transcribe',beam_size=1,vad_filter=True)
              original=[{'start':s.start,'end':s.end,'text':s.text.strip()} for s in seg]
              english=original
              if info.language!='en':
                  seg,_=model.transcribe(files[0],task='translate',language=info.language,beam_size=1,vad_filter=True)
                  english=[{'start':s.start,'end':s.end,'text':s.text.strip()} for s in seg]
              transcript={'language':info.language,'original_segments':original,'english_segments':english,'english_text':' '.join(s['text'] for s in english)}
              with open('osint-output/transcript.json','w') as f: json.dump(transcript,f,ensure_ascii=False,indent=2)
              with open('osint-output/english.txt','w') as f: f.write(transcript['english_text'])
          PY
      - name: Generate readable report
        if: always()
        run: |
          python - <<'PY'
          import json,os
          base='osint-output'
          result_path=base+'/result.json'
          if not os.path.isfile(result_path):
              result={'status':'FAILED_BEFORE_EXTRACTION','source_url':'unknown','metadata':None}
              os.makedirs(base,exist_ok=True)
              with open(result_path,'w') as f: json.dump(result,f)
          result=json.load(open(result_path))
          m=result.get('metadata') or {}
          t={}
          if os.path.isfile(base+'/transcript.json'): t=json.load(open(base+'/transcript.json'))
          report={'source_url':result.get('source_url'),'status':result.get('status'),'uploader':m.get('uploader'),'caption_or_title':m.get('title'),'media_type':m.get('type'),'duration':m.get('duration'),'detected_language':t.get('language'),'english_transcript':t.get('english_text'),'original_segments':t.get('original_segments',[])}
          with open(base+'/report.json','w') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          with open(base+'/report.md','w') as f:
              f.write('# Percept Instagram OSINT\n\n')
              for key,val in report.items():
                  if key!='original_segments': f.write(f'**{key}:** {val if val is not None else "Not available"}\n\n')
          print('Report generated; retrieval status:',result.get('status'))
          PY
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percept-instagram-osint-report
          path: |
            osint-output/result.json
            osint-output/report.json
            osint-output/report.md
            osint-output/transcript.json
            osint-output/english.txt
          retention-days: 30
          if-no-files-found: warn
